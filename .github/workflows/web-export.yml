name: Web Export (experimental)

# Builds an experimental C#/.NET WebAssembly export of the maze project.
#
# Godot's official builds cannot export .NET projects to the web yet
# (tracking: https://github.com/godotengine/godot/pull/118976). This job uses
# ComplexRobot's patched Windows editor build, which bundles raulsntos' .NET-web
# prototype (https://github.com/godotengine/godot/pull/106125). The patched editor
# ships Windows-only, which is why this runs on a `windows-latest` runner rather
# than locally on macOS.
#
# The output (build/web) is uploaded as an artifact for download/testing and is the
# input you would later host behind COOP/COEP headers (see docs/WEB_EXPORT.md).
#
# This is experimental: the first runs are a probe. Read the logs — version
# mismatches between the project's Godot version and the fork build (see GODOT_FORK_TAG)
# are the most likely failure, and surfacing that is the point.

on:
  # Push trigger lets this run from the feature branch before it reaches the
  # default branch (workflow_dispatch is only dispatchable from the default branch).
  push:
    branches: [feat/dotnet-web-export]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "resources/**"
      - "project.godot"
      - "export_presets.cfg"
      - "*.csproj"
      - "Program.cs"
      - ".github/workflows/web-export.yml"
  workflow_dispatch:
    inputs:
      godot_fork_tag:
        description: "ComplexRobot/godot-dotnet-web-export release tag (editor + web templates)"
        required: true
        default: "4.7-stable"
      template_version:
        description: "Export-template version folder name (must match the editor build)"
        required: true
        default: "4.7.stable.mono"

permissions:
  contents: read

jobs:
  export-web:
    runs-on: windows-latest

    env:
      FORK_REPO: ComplexRobot/godot-dotnet-web-export
      # Fall back to defaults on push events, where workflow inputs are unset.
      FORK_TAG: ${{ github.event.inputs.godot_fork_tag || '4.7-stable' }}
      TEMPLATE_VERSION: ${{ github.event.inputs.template_version || '4.7.stable.mono' }}
      EXPORT_PRESET: "Web"
      EXPORT_OUT: "build/web/index.html"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Download patched Godot editor (web-export fork)
        shell: pwsh
        run: |
          $asset = "Godot_v${env:FORK_TAG}_mono_web_export_win64.zip"
          Write-Host "Downloading $asset from $env:FORK_REPO@$env:FORK_TAG"
          gh release download "$env:FORK_TAG" --repo "$env:FORK_REPO" --pattern "$asset" --dir "$env:RUNNER_TEMP"
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $asset) -DestinationPath "$env:RUNNER_TEMP/godot" -Force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Locate editor executable and bundle contents
        id: locate
        shell: pwsh
        run: |
          # The fork zip nests the editor + install assets in a folder; find them dynamically
          # so we don't hard-code names that change between releases.
          $root = "$env:RUNNER_TEMP/godot"
          $exe = Get-ChildItem -Path $root -Recurse -Filter "*.exe" |
                 Where-Object { $_.Name -match "console" } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $root -Recurse -Filter "*.exe" |
                   Where-Object { $_.Name -notmatch "crash|handler" } | Select-Object -First 1
          }
          if (-not $exe) { throw "Could not find a Godot editor executable in the fork zip." }
          $bundle = $exe.Directory.FullName
          Write-Host "Editor exe: $($exe.FullName)"
          "godot_exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "bundle_dir=$bundle" >> $env:GITHUB_OUTPUT

      - name: Install web export templates (self-contained mode)
        shell: pwsh
        run: |
          # Self-contained mode keeps everything next to the editor (reproducible, no AppData).
          $bundle = "${{ steps.locate.outputs.bundle_dir }}"
          New-Item -ItemType File -Force -Path (Join-Path $bundle "._sc_") | Out-Null
          $tplDir = Join-Path $bundle "editor_data/export_templates/${env:TEMPLATE_VERSION}"
          New-Item -ItemType Directory -Force -Path $tplDir | Out-Null
          # The fork bundles the web templates as web_release.zip / web_debug.zip.
          $templates = Get-ChildItem -Path "$env:RUNNER_TEMP/godot" -Recurse -Include "web_release.zip","web_debug.zip"
          if (-not $templates) {
            Write-Host "Files present under the fork bundle (for debugging):"
            Get-ChildItem -Path "$env:RUNNER_TEMP/godot" -Recurse -File | Select-Object -ExpandProperty FullName
            throw "No web_release.zip / web_debug.zip found in the fork bundle."
          }
          $templates | ForEach-Object { Copy-Item $_.FullName -Destination $tplDir -Force; Write-Host "Installed template: $($_.Name)" }
          Write-Host "Templates in ${tplDir}:"; Get-ChildItem $tplDir

      - name: Register bundled NuGet source (if present)
        shell: pwsh
        run: |
          $nuget = Get-ChildItem -Path "$env:RUNNER_TEMP/godot" -Recurse -Directory -Filter "nuget" | Select-Object -First 1
          if ($nuget) {
            Write-Host "Adding local NuGet source: $($nuget.FullName)"
            dotnet nuget add source "$($nuget.FullName)" --name godot-web-fork
          } else {
            Write-Host "No bundled nuget folder found; relying on nuget.org."
          }

      - name: Restore / build (net9.0)
        run: dotnet build ProceduralGeneration3DMazes.csproj -c ExportRelease /p:GodotTargetPlatform=web

      - name: Import resources (headless)
        shell: pwsh
        run: |
          # First open imports assets and generates the .godot cache; allow it to exit.
          & "${{ steps.locate.outputs.godot_exe }}" --headless --path . --import 2>&1 | Tee-Object -FilePath import.log
        continue-on-error: true

      - name: Export Web (headless CLI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/web" | Out-Null
          & "${{ steps.locate.outputs.godot_exe }}" --headless --path . --export-release "$env:EXPORT_PRESET" "$env:EXPORT_OUT" 2>&1 | Tee-Object -FilePath export.log
          if (-not (Test-Path "build/web/index.html")) {
            Write-Host "::error::Export did not produce build/web/index.html — see export.log"
            exit 1
          }
          Write-Host "Export output:"; Get-ChildItem build/web

      - name: Upload web export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maze-web-export
          path: |
            build/web/**
            export.log
            import.log
          if-no-files-found: warn

  # Continuous deployment: publish the export to the `maze` Vercel project
  # (custom domain maze.ryankelly.dev). Skips gracefully until the three
  # VERCEL_* repo secrets are set — see docs/WEB_EXPORT.md.
  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          name: maze-web-export
          path: artifact

      - name: Gate on Vercel secrets
        id: gate
        run: echo "ready=${{ env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.gate.outputs.ready != 'true'
        run: echo "::notice::VERCEL_* secrets not set — skipping deploy. The export artifact is still available above."

      - name: Assemble deploy directory (with COOP/COEP headers)
        if: steps.gate.outputs.ready == 'true'
        run: |
          test -f artifact/build/web/index.html || { echo "::error::export artifact missing index.html"; exit 1; }
          cp infra/vercel/vercel.json artifact/build/web/vercel.json
          ls -la artifact/build/web

      - name: Deploy to Vercel (production)
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm i -g vercel@latest
          url=$(vercel deploy artifact/build/web --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "$url" > deploy-url.txt

      - name: Upload deploy URL
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-url
          path: deploy-url.txt
