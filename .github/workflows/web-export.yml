name: Web Export & Deploy

# Builds the experimental C#/.NET WebAssembly export (Windows runner), deploys it to
# the `maze` Vercel project, then smoke-tests that the deployed build actually boots.
#
#   * push to main                    → PRODUCTION deploy (aliases maze.ryankelly.dev)
#   * comment "/preview" on a PR      → on-demand PREVIEW deploy (unique URL, posted back)
#   * workflow_dispatch               → PREVIEW by default; production requires
#                                       deploy_target=production AND ref main
#
# workflow_dispatch is the path an automated caller (an agent with GitHub API access, with no
# ability to comment as an OWNER) should use: it needs no comment, and unlike issue_comment it
# runs the workflow file AND the checkout from the ref you dispatch, so a branch's own changes
# to this workflow and to .github/smoke/ are actually exercised. An issue_comment run always
# takes the workflow from the default branch, which is how a build stamp added on a branch
# silently arrived empty (see docs/BUILD_VERIFICATION.md).
#
# The fast test gate lives in test.yml and runs on every PR. The expensive Windows
# export here only runs on merge to main or an explicit /preview, to keep runner
# usage down (Windows minutes bill at a premium). Deploy steps are gated on the
# VERCEL_* secrets and skip cleanly until those are set — see docs/WEB_EXPORT.md.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "resources/**"
      - "project.godot"
      - "export_presets.cfg"
      - "*.csproj"
      - "Program.cs"
      - ".github/workflows/web-export.yml"
      - ".github/actions/export-web/**"
      - ".github/editor-checksums.txt"
      - ".github/web-toolchain.env"
  workflow_dispatch:
    # Both version inputs are blank by default: the versions come from
    # .github/web-toolchain.env so that dispatch, push-to-main and /preview always agree.
    # Fill one in only to test an unpinned editor build ad hoc — note the checksum guard
    # still requires an entry in .github/editor-checksums.txt for whatever tag you name.
    inputs:
      deploy_target:
        description: "preview (default, throwaway URL) or production (main only, aliases maze.ryankelly.dev)"
        required: false
        default: "preview"
        type: choice
        options: ["preview", "production"]
      godot_fork_tag:
        description: "Override patched-editor release tag (blank = .github/web-toolchain.env)"
        required: false
        default: ""
      template_version:
        description: "Override export-template folder name (blank = .github/web-toolchain.env)"
        required: false
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: web-export-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Production: merge to main (or manual dispatch) ──────────────────────────
  production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      build_commit: ${{ steps.export.outputs.build_commit }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export web (WASM)
        id: export
        uses: ./.github/actions/export-web
        with:
          # Pass dispatch overrides straight through; blank resolves from
          # .github/web-toolchain.env, identically to the preview job below.
          godot_fork_tag: ${{ github.event.inputs.godot_fork_tag }}
          template_version: ${{ github.event.inputs.template_version }}
          github_token: ${{ github.token }}
          # Stamps the artefact with the commit it came from, so the About screen and
          # build-info.json identify exactly what is being served.
          build_commit: ${{ github.sha }}
          build_branch: ${{ github.ref_name }}
          build_repository: ${{ github.repository }}
          build_run_id: ${{ github.run_id }}
          build_run_attempt: ${{ github.run_attempt }}

      - name: Deploy to Vercel
        id: deploy
        if: env.VERCEL_TOKEN != ''
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          IN_TARGET: ${{ github.event.inputs.deploy_target }}
          BUILD_COMMIT: ${{ steps.export.outputs.build_commit }}
        run: |
          Copy-Item infra/vercel/vercel.json build/web/vercel.json -Force
          npm i -g vercel@latest

          # Target is STATED, not inferred from the ref. It used to be "main means --prod",
          # which made a dispatch the wrong branch away from silently publishing to
          # maze.ryankelly.dev -- an unacceptable footgun now that agents dispatch this
          # workflow to get preview URLs (see docs/BUILD_VERIFICATION.md).
          $target = if ($env:EVENT_NAME -eq 'push') { 'production' }
                    elseif ([string]::IsNullOrWhiteSpace($env:IN_TARGET)) { 'preview' }
                    else { $env:IN_TARGET }

          if ($target -eq 'production' -and $env:GIT_REF -ne 'refs/heads/main') {
            throw "deploy_target=production is only allowed on refs/heads/main (got $env:GIT_REF). Use 'preview'."
          }

          if ($target -eq 'production') {
            $url = (vercel deploy build/web --prod --yes --token=$env:VERCEL_TOKEN) | Select-Object -Last 1
          } else {
            $url = (vercel deploy build/web --yes --token=$env:VERCEL_TOKEN) | Select-Object -Last 1
          }

          "url=$url" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT

          # A single machine-readable line so a caller reading the job log (an agent via the
          # GitHub API, for instance) does not have to parse vercel's own chatter.
          Write-Host "DEPLOY_URL=$url"
          Write-Host "DEPLOY_TARGET=$target"

          # Also in the step summary, which is one short API call rather than a whole log.
          @(
            "### $target deploy",
            "",
            "| | |",
            "|---|---|",
            "| URL | <$url> |",
            "| Commit | ``$env:BUILD_COMMIT`` |",
            "| Build info | <$url/build-info.json> |"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Skip notice (no secrets)
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_* secrets not set — export ran but production deploy was skipped."

  smoke-production:
    needs: production
    if: needs.production.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install Playwright (chromium)
        run: |
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Smoke test the deployed build
        env:
          SMOKE_URL: ${{ needs.production.outputs.url }}
          # Asserts the alias actually serves the artefact this run built, rather than a
          # previous one that a failed promotion left in place. Taken from the export itself
          # rather than github.sha, which is the wrong commit for issue_comment-triggered runs.
          EXPECT_COMMIT: ${{ needs.production.outputs.build_commit }}
        run: node .github/smoke/smoke.mjs


  # Visual regression against the DEPLOYED build, after the smoke test proves it boots.
  # Screenshotting a build that didn't start just yields a blank baseline.
  #
  # MAZE_TEST_BRIDGE gates both browser suites. The in-app bridge
  # (scripts/testing/TestBridge.cs) provides URL seeding and the state channel they need. It
  # is unit- and scene-tested, but whether it survives the *patched* web export template is
  # unproven until a deploy exists to check against -- so both suites skip rather than risk a
  # false red. Flip to "1" after confirming window.__mazeTestApi === "1" on a deploy.
  # See docs/TEST_BRIDGE.md -> "Enabling in CI".
  visual-production:
    needs: [production, smoke-production]
    if: needs.production.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Playwright (chromium)
        working-directory: tests/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Functional tests (via the in-app test bridge)
        working-directory: tests/visual
        env:
          MAZE_URL: ${{ needs.production.outputs.url }}
          MAZE_TEST_BRIDGE: "0"
        run: npx playwright test --project=functional

      - name: Visual regression
        working-directory: tests/visual
        env:
          MAZE_URL: ${{ needs.production.outputs.url }}
          MAZE_TEST_BRIDGE: "0"
        run: npx playwright test --project=maze

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-production-report
          path: |
            tests/visual/playwright-report/
            tests/visual/test-results/
          if-no-files-found: ignore

  # ── Preview: on-demand via "/preview" comment on a PR (owner only) ──────────
  preview:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      build_commit: ${{ steps.export.outputs.build_commit }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acknowledge command (👀)
        shell: pwsh
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      - name: Resolve PR head SHA
        id: pr
        shell: pwsh
        run: |
          $sha = gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefOid -q ".headRefOid"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          # Needed for the build stamp: a preview builds the PR head, so github.sha (the
          # default branch, for an issue_comment event) would stamp the wrong commit entirely.
          $ref = gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName -q ".headRefName"
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Export web (WASM)
        id: export
        uses: ./.github/actions/export-web
        with:
          github_token: ${{ github.token }}
          # The PR head, not github.sha — see the note in the step above.
          build_commit: ${{ steps.pr.outputs.sha }}
          build_branch: ${{ steps.pr.outputs.ref }}
          build_repository: ${{ github.repository }}
          build_run_id: ${{ github.run_id }}
          build_run_attempt: ${{ github.run_attempt }}

      - name: Deploy to Vercel (preview)
        id: deploy
        if: env.VERCEL_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item infra/vercel/vercel.json build/web/vercel.json -Force
          npm i -g vercel@latest
          $url = (vercel deploy build/web --yes --token=$env:VERCEL_TOKEN) | Select-Object -Last 1
          "url=$url" >> $env:GITHUB_OUTPUT
          Write-Host "Preview: $url"

      - name: Comment preview URL
        if: env.VERCEL_TOKEN != ''
        shell: pwsh
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🔗 Preview deployed: ${{ steps.deploy.outputs.url }}"

      - name: Comment if secrets missing
        if: env.VERCEL_TOKEN == ''
        shell: pwsh
        run: |
          gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "/preview ran the export, but VERCEL_* secrets are not configured — deploy skipped."

  smoke-preview:
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install Playwright (chromium)
        run: |
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Smoke test the preview build
        id: smoke
        env:
          SMOKE_URL: ${{ needs.preview.outputs.url }}
          EXPECT_COMMIT: ${{ needs.preview.outputs.build_commit }}
        run: node .github/smoke/smoke.mjs
      - name: Report smoke result on PR
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✅ Smoke test passed on the preview (boots, cross-origin isolated, canvas rendered)."
          else
            gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "❌ Smoke test FAILED on the preview — the build served but did not boot correctly. Check the workflow logs."
          fi

  # Visual regression against the DEPLOYED build, after the smoke test proves it boots.
  # Screenshotting a build that didn't start just yields a blank baseline.
  #
  # MAZE_TEST_BRIDGE gates both browser suites. The in-app bridge
  # (scripts/testing/TestBridge.cs) provides URL seeding and the state channel they need. It
  # is unit- and scene-tested, but whether it survives the *patched* web export template is
  # unproven until a deploy exists to check against -- so both suites skip rather than risk a
  # false red. Flip to "1" after confirming window.__mazeTestApi === "1" on a deploy.
  # See docs/TEST_BRIDGE.md -> "Enabling in CI".
  visual-preview:
    needs: [preview, smoke-preview]
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Playwright (chromium)
        working-directory: tests/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Functional tests (via the in-app test bridge)
        working-directory: tests/visual
        env:
          MAZE_URL: ${{ needs.preview.outputs.url }}
          MAZE_TEST_BRIDGE: "0"
        run: npx playwright test --project=functional

      - name: Visual regression
        working-directory: tests/visual
        env:
          MAZE_URL: ${{ needs.preview.outputs.url }}
          MAZE_TEST_BRIDGE: "0"
        run: npx playwright test --project=maze

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-preview-report
          path: |
            tests/visual/playwright-report/
            tests/visual/test-results/
          if-no-files-found: ignore
